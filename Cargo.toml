[package]
name = "stereoscopy"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Convert 2D video / DVDs to stereoscopic 3D with optional DVD authoring"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "stereoscopy"
path = "src/main.rs"

[lib]
name = "stereoscopy"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization (ffprobe JSON, config files)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Phase 3: depth estimation
# ort 2.0.0-rc.13 uses ndarray 0.17 — keep the two aligned so tensor types unify.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"

# Phase 4: stereo view synthesis
rayon = "1.10"

[features]
default = []
# Opt-in GPU support — requires a matching CUDA runtime on PATH.
cuda = ["ort/cuda"]

# Platform FFI (statvfs for disk-free; trivial compile cost)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Phase 4+ dependencies will be added as their phases land:
# rayon, imageproc, indicatif, figment, toml, ureq

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
